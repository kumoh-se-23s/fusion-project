plugins {
    id 'java'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}
group = 'com.fusion'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url = uri("https://maven.apsode.co.kr/snapshots") }
        }
        filter { includeGroup("com.minihttp") }
    }
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor(0, "seconds")
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.slf4j:slf4j-simple:1.7.36'

    implementation("com.mysql:mysql-connector-j:26.7.0")
    
    compileOnly("org.projectlombok:lombok:1.18.48")
    annotationProcessor("org.projectlombok:lombok:1.18.48")

    implementation("org.apache.commons:commons-dbcp2:2.13.0")

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    implementation 'redis.clients:jedis:5.2.0'

    implementation 'com.minihttp:minimal-http-framework:0.1.0-SNAPSHOT'

}

tasks.test {
    useJUnitPlatform()
    testLogging.showStandardStreams = true
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}
// 엔드포인트 테스트 (클라이언트 -> 엔드포인트 -> 로직). 실행: ./gradlew apiTest
// 기존 src/test와 분리해서 서로의 컴파일 오류에 영향을 받지 않게 한다.
sourceSets {
    apiTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    apiTestImplementation.extendsFrom implementation, testImplementation
    apiTestRuntimeOnly.extendsFrom runtimeOnly, testRuntimeOnly
    apiTestCompileOnly.extendsFrom compileOnly
    apiTestAnnotationProcessor.extendsFrom annotationProcessor
}

tasks.register('apiTest', Test) {
    description = 'docs에 잡힌 엔드포인트 기준 테스트를 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.apiTest.output.classesDirs
    classpath = sourceSets.apiTest.runtimeClasspath
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
